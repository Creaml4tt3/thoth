[workspace]
resolver = "3"
members = ["crates/thoth-host", "crates/thoth-mcp", "apps/desktop/src-tauri"]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
thoth-host = { path = "crates/thoth-host" }
base64 = "0.22"
getrandom = "0.3"
log = "0.4"
notify = "8"
notify-debouncer-full = "0.5"
rusqlite = { version = "0.37", features = ["bundled", "hooks", "limits"] }
rustix = { version = "1", features = ["fs", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tempfile = "3"
thiserror = "2"
# Windows host file layer and Agent Hub process control (crates/thoth-host/src/win, agent/kill_windows.rs).
# Exact pin; the same version the Tauri stack already locks.
windows-sys = { version = "=0.61.2", features = [
  "Wdk_Foundation",
  "Wdk_Storage_FileSystem",
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_IO",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
  "Win32_System_WindowsProgramming",
] }
unicode-normalization = "0.1"
# Workspace-server client (Phase 2b part 3). Exact pins; each release is at least three weeks old.
# ureq: blocking HTTP, rustls + webpki roots, no gzip (bodies are capped before decoding), no env proxy.
ureq = { version = "=3.4.2", default-features = false, features = ["rustls"] }
url = "=2.5.8"
sha2 = "=0.10.9"
# The OS keychain, desktop shell only. Platform-native stores only: macOS Keychain, Windows Credential
# Manager, Linux kernel keyutils. No Secret Service/D-Bus, no OpenSSL.
keyring = { version = "=3.6.3", features = ["apple-native", "windows-native", "linux-native"] }
# The app data folder's parent, as Tauri's `app_data_dir` finds it (ADR-0031). The version Tauri already locks.
dirs = "=7.0.0"
tauri = { version = "2", features = [] }
tauri-build = { version = "2", features = [] }
tauri-plugin-dialog = "2"
# System notifications (ADR-0018). Exact pin, released 2026-10-01 (at least three weeks old); the JS side,
# @tauri-apps/plugin-notification, is pinned to the same version.
tauri-plugin-notification = "=2.5.1"
# In-app updates (ADR-0034), desktop shell only, through its Rust API (no JS permission is granted). Exact pin, released
# 2026-10-07 (at least three weeks old), for tauri ^2.12. No system proxy (as the host's own requests), rustls only.
tauri-plugin-updater = { version = "=2.13.2", default-features = false, features = ["rustls-tls"] }
# A small, redacted, rotating local log for bug reports (ADR-0040), desktop shell only, through its Rust API (no JS
# permission is granted). Exact pin, released 2026-09-26 (at least three weeks old). Brings fern, and num_threads (the
# plugin's required time/local-offset); its Android-only crates aren't built on desktop.
tauri-plugin-log = "=2.10.0"
# Deleting a page or folder of the Private Space moves it to the system Trash (Finder, Recycle Bin, freedesktop), desktop
# shell only. Exact pin, released 2026-09-13 (at least three weeks old).
trash = "=5.2.9"
# Only to name the updater's redirect policy (no redirects) and TLS rule: the version tauri and the updater already lock.
reqwest = { version = "=0.13.5", default-features = false }
