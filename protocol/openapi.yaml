components:
  schemas:
    AttachmentResource:
      type: object
      properties:
        hash:
          type: string
          pattern: ^[0-9a-f]{64}$
        size:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        mimeType:
          type: string
        id:
          type: string
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
        workspaceId:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[A-Za-z0-9_.~-]+$
        fileName:
          type: string
        createdAt:
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z|([+-](?:[01]\d|2[0-3]):[0-5]\d)))$
        createdBy:
          anyOf:
            - type: string
              minLength: 1
              maxLength: 128
              pattern: ^[A-Za-z0-9_.~-]+$
            - type: "null"
      required:
        - hash
        - size
        - mimeType
        - id
        - workspaceId
        - createdAt
        - createdBy
    Capabilities:
      type: object
      properties:
        protocolVersion:
          type: string
          pattern: ^\d+\.\d+$
        capabilities:
          type: array
          items:
            anyOf:
              - type: string
                enum:
                  - attachments
                  - search
                  - events.sse
                  - transfers
                  - page-order
                  - page-kind
                  - public-share
                  - members
                  - invite-links
                  - databases
                  - realtime-collab
              - type: string
                pattern: ^x-[a-z0-9]+(?:[.-][a-z0-9]+)*$
          uniqueItems: true
        limits:
          $ref: "#/components/schemas/Limits"
        server:
          type: object
          properties:
            name:
              type: string
            version:
              type: string
          required:
            - name
        signIn:
          type: object
          properties:
            authorizationEndpoint:
              type: string
              format: uri
            tokenEndpoint:
              type: string
              format: uri
            revocationEndpoint:
              type: string
              format: uri
            providers:
              minItems: 1
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                    minLength: 1
                  name:
                    type: string
                    minLength: 1
                required:
                  - id
                  - name
          required:
            - authorizationEndpoint
            - tokenEndpoint
            - revocationEndpoint
            - providers
      required:
        - protocolVersion
        - capabilities
    ChangeEntry:
      type: object
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[A-Za-z0-9_.~-]+$
        kind:
          anyOf:
            - type: string
              enum:
                - page.created
                - page.updated
                - page.deleted
                - attachment.created
            - type: string
              pattern: ^x-[a-z0-9]+(?:[._-][a-z0-9]+)*$
        occurredAt:
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z|([+-](?:[01]\d|2[0-3]):[0-5]\d)))$
        actorId:
          anyOf:
            - type: string
              minLength: 1
              maxLength: 128
              pattern: ^[A-Za-z0-9_.~-]+$
            - type: "null"
        pageId:
          type: string
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
        revisionId:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[A-Za-z0-9_.~-]+$
        parentId:
          anyOf:
            - type: string
              pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
            - type: "null"
        title:
          type: string
        position:
          anyOf:
            - type: string
              pattern: ^[0-9A-Za-z]{1,128}$
              description: Opaque fractional-index sort key among siblings, compared as a byte string (capability page-order).
            - type: "null"
        pageKind:
          anyOf:
            - type: string
              enum:
                - page
                - folder
              description: "Kind of page (capability page-kind): a folder page or an ordinary page. Absent or null means unknown, treated as a page."
            - type: "null"
        attachmentId:
          type: string
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
      required:
        - id
        - kind
        - occurredAt
        - actorId
    ChangeHintEvent:
      type: object
      properties:
        type:
          type: string
          const: changes.available
        workspaceId:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[A-Za-z0-9_.~-]+$
        cursor:
          type: string
          minLength: 1
          maxLength: 2048
          pattern: ^[A-Za-z0-9_.~-]+$
          description: Opaque cursor. Clients must not parse or construct it.
      required:
        - type
        - workspaceId
    ChangesResponse:
      type: object
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/ChangeEntry"
          description: Changes after the request cursor, oldest first.
        cursor:
          type: string
          minLength: 1
          maxLength: 2048
          pattern: ^[A-Za-z0-9_.~-]+$
          description: Opaque position after the last returned entry. Pass it back as `cursor` to continue.
        hasMore:
          type: boolean
          description: True when more entries are available now; read until false.
      required:
        - entries
        - cursor
        - hasMore
    InviteAccepted:
      type: object
      properties:
        workspaceId:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[A-Za-z0-9_.~-]+$
        name:
          type: string
        role:
          type: string
          enum:
            - owner
            - editor
            - viewer
        joined:
          type: boolean
      required:
        - workspaceId
        - name
        - role
        - joined
    InviteAcceptRequest:
      type: object
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 512
      required:
        - token
    InviteLink:
      type: object
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[A-Za-z0-9_.~-]+$
        workspaceId:
          type: string
          minLength: 1
          maxLength: 128
