    put:
      operationId: setMemberRole
      tags:
        - Members
      summary: Change a member's role
      description: |-
        Owners only (403 for others; 404 for non-members and for a user who is not a member). Making someone an owner counts against that account's `maxWorkspacesPerAccount` (409 `quota_exceeded`, `quota: workspacesPerAccount`). Demoting the last owner is 409 `last_owner`. Setting the role a member already has succeeds and changes nothing.

        Requires capability `members`.
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/UserId"
        - name: Idempotency-Key
          in: header
          required: false
          description: Opaque key of 1 to 255 visible ASCII characters (a UUID is recommended). A replay with the same key and request returns the original response; the same key with a different request is 422 idempotency_key_reused.
          schema:
            type: string
            minLength: 1
            maxLength: 255
            pattern: ^[\x21-\x7e]+$
      requestBody:
        required: true
        description: The new role.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberRoleChange"
      responses:
        "200":
          description: The member with the new role.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
        "400":
          $ref: "#/components/responses/Problem400"
          description: "`validation_failed`: The request is malformed or a field, header, or query parameter is invalid."
        "401":
          $ref: "#/components/responses/Problem401"
          description: "`unauthenticated`: Credentials are missing, malformed, expired, or revoked."
        "403":
          $ref: "#/components/responses/Problem403"
          description: "`forbidden`: The principal can see the resource but its role does not allow the action."
        "404":
          $ref: "#/components/responses/Problem404"
          description: "`not_found`: The route or resource does not exist, or the principal may not know that it exists."
        "409":
          $ref: "#/components/responses/Problem409"
          description: "`last_owner`: The change would leave the workspace without an owner (ADR-0024). Make another member an owner first. `quota_exceeded`: The request is valid and permitted, but would exceed a quota of the workspace, the account or the server. Freeing space or waiting can make the same request succeed. The body may carry `quota`, `limit` and `current`."
        "422":
          $ref: "#/components/responses/Problem422"
          description: "`idempotency_key_reused`: The Idempotency-Key was already used with a different request."
        "429":
