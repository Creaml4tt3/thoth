        Requires capability `page-order`.
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/PageId"
        - name: If-Match
          in: header
          required: true
          description: Strong entity tag of the revision being replaced or deleted, for example `"01J..."`. `*` is not accepted.
          schema:
            type: string
            pattern: ^"[A-Za-z0-9_.~-]{1,128}"$
        - name: Idempotency-Key
          in: header
          required: false
          description: Opaque key of 1 to 255 visible ASCII characters (a UUID is recommended). A replay with the same key and request returns the original response; the same key with a different request is 422 idempotency_key_reused.
          schema:
            type: string
            minLength: 1
            maxLength: 255
            pattern: ^[\x21-\x7e]+$
      requestBody:
        required: true
        description: New parent and/or position; at least one member.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PageMove"
      responses:
        "200":
          description: The page's tree node after the move.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
