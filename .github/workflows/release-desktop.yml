# Builds the desktop installers and publishes them to Cloudflare R2 (bucket `thoth-downloads`, served at
# https://download.thothnotes.com/). Runs on a `v*` tag or by hand. See docs/deploy/release.md.
#
#   v0.1.0/Thoth_0.1.0_universal.dmg            macOS, Apple silicon and Intel
#   v0.1.0/Thoth_0.1.0_x64-setup.exe, ..._x64_en-US.msi   Windows x64 (NSIS and MSI)
#   v0.1.0/Thoth_0.1.0_amd64.AppImage, ..._amd64.deb      Linux
#   v0.1.0/SHA256SUMS                          checksums of the files above
#   v0.1.0/*.sig, Thoth_0.1.0_universal.app.tar.gz   in-app updates (ADR-0034): each update's signature, the Mac archive
#   latest.json                                the newest release (version, date, files, sizes, SHA-256) and the
#                                              updater's `platforms` (each update's address and signature)
#
# In-app updates are signed with the key in the repository secrets TAURI_SIGNING_PRIVATE_KEY and
# TAURI_SIGNING_PRIVATE_KEY_PASSWORD (docs/deploy/release.md, "Signing in-app updates"). A release stops before it
# builds if the app's public key is still the placeholder or the private key is missing, and publish-downloads.ts
# refuses an installer without its signed update: nothing unsigned is published.
#
# The builds are not code-signed with a Developer ID yet: the macOS app is ad-hoc signed (tauri.conf.json
# signingIdentity "-"), so it is a sealed bundle but Gatekeeper still asks the user to choose Open Anyway once;
# the website says how. The Windows installers are unsigned, so SmartScreen warns about an unknown publisher.
#
# Before anything is published, the Windows host tests run (`test-windows`): the native host's Windows file
# layer and Agent Hub process control (cargo test), and the shared port contract against it (Vitest).
#
# Caches: a tag's run may read only its own caches and those of `main`, so a cache saved by a tag is never used again.
# The Rust caches are saved on `main` only (a run by hand, publish off: `gh workflow run release-desktop.yml --ref main
# -f publish=false`), and every release restores them; without one, a release builds everything from scratch.
#
# Actions are pinned to commit SHAs of releases at least three weeks old.
name: Release desktop

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Upload to R2 (off: build only, files stay as workflow artifacts)"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS universal
            os: macos-latest
            targets: aarch64-apple-darwin,x86_64-apple-darwin
            sidecar: universal-apple-darwin
            args: --target universal-apple-darwin --bundles app,dmg
            out: target/universal-apple-darwin/release/bundle
          # crates/thoth-host's Windows file layer (src/win) keeps every path inside the Private Space with
          # NtCreateFile relative to the vault's directory handle and refuses reparse points; see docs/deploy/release.md.
          - name: Windows x64
            os: windows-latest
            targets: x86_64-pc-windows-msvc
            sidecar: x86_64-pc-windows-msvc
            args: --bundles nsis,msi
            out: target/release/bundle
          - name: Linux x64
            os: ubuntu-22.04
            targets: x86_64-unknown-linux-gnu
            sidecar: x86_64-unknown-linux-gnu
            args: --bundles appimage,deb
            out: target/release/bundle
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Linux build libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # stable, 2026-10-01
        with:
          toolchain: stable
          targets: ${{ matrix.targets }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.name }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - run: pnpm install --frozen-lockfile
      # thoth-mcp, the MCP server other apps start (ADR-0021), goes next to the app's program (Tauri externalBin).
      - name: Build thoth-mcp
        run: node scripts/build-mcp-sidecar.ts ${{ matrix.sidecar }}
      - name: Signed updates only (ADR-0034)
        if: github.event_name == 'push' || inputs.publish
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if grep -q THOTH_UPDATER_PUBKEY_PLACEHOLDER apps/desktop/src-tauri/tauri.conf.json; then
            echo "::error::plugins.updater.pubkey in tauri.conf.json is still the placeholder: put the real public key there first"
            exit 1
          fi
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::the TAURI_SIGNING_PRIVATE_KEY repository secret is missing: updates would be unsigned"
            exit 1
          fi
      - name: Build installers
        env:
          # The updater files (bundle.createUpdaterArtifacts) are signed with it; the build fails without it.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm --filter @thoth/desktop tauri build --config src-tauri/tauri.sidecar.conf.json ${{ matrix.args }}

      - name: Collect installers
        shell: bash
        run: |
          mkdir -p dist-release
          find "${{ matrix.out }}" -maxdepth 2 -type f \( -name '*.dmg' -o -name '*.exe' -o -name '*.msi' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.exe.sig' -o -name '*.msi.sig' -o -name '*.AppImage.sig' \) -exec cp {} dist-release/ \;
          # The Mac update is the app archive, named without its version by Tauri: given the release's name here.
          if [ -f "${{ matrix.out }}/macos/Thoth.app.tar.gz" ]; then
            version=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")
            cp "${{ matrix.out }}/macos/Thoth.app.tar.gz" "dist-release/Thoth_${version}_universal.app.tar.gz"
            cp "${{ matrix.out }}/macos/Thoth.app.tar.gz.sig" "dist-release/Thoth_${version}_universal.app.tar.gz.sig"
          fi
          ls -la dist-release
          test -n "$(ls dist-release)"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: installers-${{ runner.os }}
          path: dist-release/*
          if-no-files-found: error
          retention-days: 14

  test-windows:
    name: Test (Windows host)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      # Check out with LF endings, as on macOS and Linux: test fixtures are compared byte for byte.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # stable, 2026-10-01
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: windows-test
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: pnpm install --frozen-lockfile
      - name: Host tests (file layer, Agent Hub, servers)
        run: cargo test -p thoth-host -p thoth-mcp
      - name: Port contract against the Windows host
        run: pnpm exec vitest run tests/ports/rust.test.ts tests/ports/rust-host.test.ts tests/ports/vault-on-rust.test.ts
      - name: Desktop shell tests (capability, Explorer and browser launchers)
        run: |
          pnpm --filter @thoth/desktop build
          cargo test -p thoth-desktop

  publish:
    name: Publish to R2
    needs: [build, test-windows]
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: downloads
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: installers-*
          path: dist-release
          merge-multiple: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Upload to R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: node scripts/publish-downloads.ts dist-release

  # The GitHub release for the tag, with that version's section of CHANGELOG.md as its body (scripts/release-notes.ts
  # fails the job if the version is missing from CHANGELOG.md). Runs after the installers are published, and only
  # for a tag; this is the one job that may write to the repository.
  github-release:
    name: GitHub release notes
    needs: [publish]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Release notes from CHANGELOG.md
        run: node scripts/release-notes.ts "$GITHUB_REF_NAME" > release-notes.md
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --notes-file release-notes.md
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "Thoth ${GITHUB_REF_NAME#v}" --notes-file release-notes.md
          fi
