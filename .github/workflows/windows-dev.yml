# TEMPORARY (windows-host-installer branch only): fast Windows iterations without the macOS build.
# Removed before the branch is handed off; the real jobs live in release-desktop.yml.
name: Windows dev

on:
  push:
    branches: [windows-host-installer]

permissions:
  contents: read

concurrency:
  group: windows-dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # stable, 2026-10-01
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: windows-test
      - run: pnpm install --frozen-lockfile
      - name: Host tests
        run: cargo test -p thoth-host --no-fail-fast
      - name: Port contract
        if: always()
        run: pnpm exec vitest run tests/ports/rust.test.ts tests/ports/rust-host.test.ts tests/ports/vault-on-rust.test.ts
      - name: Desktop shell tests (capability, Explorer and browser launchers)
        run: |
          pnpm --filter @thoth/desktop build
          cargo test -p thoth-desktop

  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # stable, 2026-10-01
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: Windows x64
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @thoth/desktop tauri build --bundles nsis,msi
      - shell: bash
        run: ls -la target/release/bundle/nsis target/release/bundle/msi
