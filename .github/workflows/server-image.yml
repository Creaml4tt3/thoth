# Publishes the workspace server's container image to GitHub Container Registry, for linux/amd64 and linux/arm64:
#
#   ghcr.io/creaml4tt3/thoth-server:0.2.7    one release
#   ghcr.io/creaml4tt3/thoth-server:0.2      the newest release of 0.2
#   ghcr.io/creaml4tt3/thoth-server:latest   the newest release
#
# Runs on a `v*` tag, beside release-desktop.yml, or by hand for an existing tag:
#   gh workflow run server-image.yml -f tag=v0.2.7
# compose.yaml and compose.external.yaml pull it (docs/deploy/self-host.md).
#
# Actions are pinned to commit SHAs of releases at least three weeks old.
name: Server image

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build, for example v0.2.7"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: server-image-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/creaml4tt3/thoth-server
          # A pre-release tag (v1.0.0-rc.1) gets only its own version; `latest` and `x.y` stay on the last release.
          tags: |
            type=semver,pattern={{version}},value=${{ env.TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.TAG }}
            type=raw,value=latest,enable=${{ !contains(env.TAG, '-') }}
          flavor: latest=false
          labels: |
            org.opencontainers.image.title=Thoth server
            org.opencontainers.image.description=Thoth workspace server: Node.js 24 and PostgreSQL
            org.opencontainers.image.licenses=Apache-2.0
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/server/Containerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
