# Publishes the workspace server's container image to GitHub Container Registry, for linux/amd64 and linux/arm64.
# Each platform builds on its own kind of runner, with no emulator: under QEMU, `pnpm install` for arm64 died with
# "Illegal instruction" (0.7.1 and 0.8.0). The two images are pushed by digest, then one manifest names both.
#
#   ghcr.io/creaml4tt3/thoth-server:0.2.7    one release
#   ghcr.io/creaml4tt3/thoth-server:0.2      the newest release of 0.2
#   ghcr.io/creaml4tt3/thoth-server:latest   the newest release
#
# Runs on a `v*` tag, beside release-desktop.yml, or by hand for an existing tag:
#   gh workflow run server-image.yml -f tag=v0.2.7
# compose.yaml and compose.external.yaml pull it (docs/deploy/self-host.md).
#
# Actions are pinned to commit SHAs of releases at least three weeks old.
name: Server image

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build, for example v0.2.7"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: server-image-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false
      # The server reports apps/server/package.json's version (GET /capabilities): refuse an image that would lie.
      - name: Tag matches the server version
        run: |
          version=$(node -p "require('./apps/server/package.json').version")
          if [ "v$version" != "$TAG" ]; then echo "::error::apps/server/package.json says $version, the tag is $TAG"; exit 1; fi
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/creaml4tt3/thoth-server
          labels: |
            org.opencontainers.image.title=Thoth server
            org.opencontainers.image.description=Thoth workspace server: Node.js 24 and PostgreSQL
            org.opencontainers.image.licenses=Apache-2.0
      # Pushed by digest only: the tags go on the manifest that `merge` makes.
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/server/Containerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=ghcr.io/creaml4tt3/thoth-server,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
      - name: Keep the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p digests
          touch "digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digest-${{ matrix.runner }}
          path: digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: digests
          pattern: digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/creaml4tt3/thoth-server
          # A pre-release tag (v1.0.0-rc.1) gets only its own version; `latest` and `x.y` stay on the last release.
          tags: |
            type=semver,pattern={{version}},value=${{ env.TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.TAG }}
            type=raw,value=latest,enable=${{ !contains(env.TAG, '-') }}
          flavor: latest=false
      - name: One manifest for both platforms
        working-directory: digests
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          test "$(ls | wc -l)" -eq 2
          args=()
          while read -r tag; do [ -n "$tag" ] && args+=(-t "$tag"); done <<< "$TAGS"
          docker buildx imagetools create "${args[@]}" $(printf 'ghcr.io/creaml4tt3/thoth-server@sha256:%s ' *)
      - name: Both platforms are there
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          # The raw index: one entry per image, plus the build's attestations (platform unknown/unknown).
          docker buildx imagetools inspect --raw "ghcr.io/creaml4tt3/thoth-server:${VERSION}" > index.json
          for arch in amd64 arm64; do
            jq -e --arg arch "$arch" '[.manifests[].platform | select(.os == "linux" and .architecture == $arch)] | length == 1' index.json > /dev/null \
              || { echo "::error::no linux/$arch image"; exit 1; }
          done
