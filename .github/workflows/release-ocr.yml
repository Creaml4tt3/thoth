# Builds the OCR module (ADR-0055) and publishes it to Cloudflare R2 (bucket `thoth-downloads`, served at
# https://download.thothnotes.com/modules/). Runs on an `ocr-v*` tag or by hand. See docs/deploy/release.md, "OCR module".
#
#   modules/ocr/<version>/<target>/thoth-ocr[.exe].gz, <ONNX Runtime library>.gz, NOTICE.txt.gz
#                                         the program: code, so it changes only with an app update (runtime.json)
#   modules/models/<id>/<version>/*.gz    the models, as modules/models.json lists them
#   modules/test/1/ocr-test.png.gz        the image every new model must read before it is switched in
#   modules/models.json, models.json.sig  the signed model list (THOTH_MODULES_SIGNING_KEY), uploaded last
#
# ONNX Runtime 1.28.0 (the version ort 2.0.0-rc.13 was built against) comes from Microsoft's NuGet package
# Microsoft.ML.OnnxRuntime 1.28.0, pinned by SHA-256 below: it has the osx-arm64, win-x64 and linux-x64 libraries.
# There is no x86_64 macOS build of 1.28.0, and its source was unreachable on 2026-11-20, so Intel Macs run the pure-Rust
# tract engine instead (ADR-0055 Decision 2 fallback, feature `tract`) with the patched detectors in the model list.
#
# runtime.json is a workflow artifact (job "prepare"): after a real publish a person commits it as
# crates/thoth-host/src/modules/runtime.json. Nothing is uploaded unless the run is a tag or publish is on.
#
# Actions are pinned to the same commit SHAs as release-desktop.yml.
name: Release OCR module

on:
  push:
    tags: ["ocr-v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Sign and upload to R2 (off: build only, files stay as workflow artifacts)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-ocr-${{ github.ref }}
  cancel-in-progress: false

env:
  ORT_NUPKG_URL: https://api.nuget.org/v3-flatcontainer/microsoft.ml.onnxruntime/1.28.0/microsoft.ml.onnxruntime.1.28.0.nupkg
  ORT_NUPKG_SHA256: 769d1d3ea8ab6cd69f737c9dd4d4462aa4ad0ccfa106eaf506efc40d7bead5db

jobs:
  build:
    name: Build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            ort: runtimes/osx-arm64/native/libonnxruntime.dylib
          - target: x86_64-apple-darwin
            os: macos-latest
            features: --features tract
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            ort: runtimes/win-x64/native/onnxruntime.dll
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            ort: runtimes/linux-x64/native/libonnxruntime.so
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # stable, 2026-10-01
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ocr-${{ matrix.target }}
          workspaces: crates/thoth-ocr
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Program version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' crates/thoth-ocr/Cargo.toml | head -1)
          echo "OUT=dist-ocr/modules/ocr/$version/${{ matrix.target }}" >> "$GITHUB_ENV"
      - name: Build thoth-ocr
        run: cargo build --manifest-path crates/thoth-ocr/Cargo.toml --release --locked --target ${{ matrix.target }} ${{ matrix.features }}
      - name: ONNX Runtime 1.28.0 (Microsoft's NuGet package, checked)
        run: |
          mkdir -p ort "$OUT"
          curl -fsSL --retry 3 -o ort/ort.nupkg "$ORT_NUPKG_URL"
          echo "$ORT_NUPKG_SHA256  ort/ort.nupkg" | { if command -v sha256sum >/dev/null; then sha256sum -c -; else shasum -a 256 -c -; fi; }
          unzip -q ort/ort.nupkg LICENSE ThirdPartyNotices.txt ${{ matrix.ort }} -d ort
          if [ -n "${{ matrix.ort }}" ]; then cp "ort/${{ matrix.ort }}" "$OUT/"; fi
      - name: Program and notices
        run: |
          exe=thoth-ocr; [ "${{ runner.os }}" = Windows ] && exe=thoth-ocr.exe
          cp "crates/thoth-ocr/target/${{ matrix.target }}/release/$exe" "$OUT/"
          extra=""; [ -n "${{ matrix.ort }}" ] && extra="ort/LICENSE ort/ThirdPartyNotices.txt"
          $(command -v python3 || command -v python) -I scripts/ocr/notice.py ${{ matrix.target }} "$OUT/NOTICE.txt" $extra
          ls -la "$OUT"
          file "$OUT"/* || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ocr-${{ matrix.target }}
          path: dist-ocr/
          if-no-files-found: error
          retention-days: 14

  models:
    name: Models
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # uv runs the detector patch with pinned onnx/onnxruntime/pyyaml (each released at least three weeks before).
      - run: python3 -m pip install --user uv==0.13.2
      - name: Stage the models (checked against models.lock)
        run: bash scripts/ocr/stage-models.sh dist-ocr
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ocr-models
          path: dist-ocr/
          if-no-files-found: error
          retention-days: 14

  # Each program, run on its own platform, must read the test image with the models it will be offered with.
  smoke:
    name: Smoke (${{ matrix.target }})
    needs: [build, models]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin, os: macos-latest, lib: libonnxruntime.dylib }
          # macos-latest is Apple silicon: the Intel program runs under Rosetta 2.
          - { target: x86_64-apple-darwin, os: macos-latest, run: arch -x86_64, det: tract }
          - { target: x86_64-pc-windows-msvc, os: windows-latest, lib: onnxruntime.dll }
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04, lib: libonnxruntime.so }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ocr-*
          path: dist-ocr
          merge-multiple: true
      - name: Read the test image with both models
        run: |
          bin=$(ls -d dist-ocr/modules/ocr/*/${{ matrix.target }})
          exe="$bin/thoth-ocr"; [ -f "$exe.exe" ] && exe="$exe.exe"
          chmod +x "$exe"
          if [ -n "${{ matrix.lib }}" ]; then export ORT_DYLIB_PATH="$PWD/$bin/${{ matrix.lib }}"; fi
          py=$(command -v python3 || command -v python)
          ${{ matrix.run }} "$exe" --version
          img=modules/ocr-test.png
          for m in fast/openthai-2.1-20261118:openthai:det.tract1280.onnx second/pp-ocrv5-th-20250821:pp5:det.tract960.onnx; do
            IFS=: read -r dir preset tract <<<"$m"
            models="dist-ocr/modules/models/$dir"
            if [ "${{ matrix.det }}" = tract ]; then
              # The Intel Mac list entry: the patched detector under the name the preset loads.
              mkdir -p "intel/$preset" && cp "$models"/* "intel/$preset/" && cp "$models/$tract" "intel/$preset/det.onnx" && models="intel/$preset"
            fi
            { printf '{"op":"image","len":%d}\n' "$(wc -c < "$img")"; cat "$img"; } \
              | ${{ matrix.run }} "$exe" serve --models "$models" --preset "$preset" > "out-$preset.jsonl"
            cat "out-$preset.jsonl"
            "$py" -I -c 'import json,sys; lines=[json.loads(l) for l in open(sys.argv[1],encoding="utf-8")]; t=lines[0]["text"]; exp=json.load(open("modules/models.json",encoding="utf-8"))["test"]["expect"]; miss=[e for e in exp if e not in t]; assert lines[-1]=={"done":True} and not miss, miss' "out-$preset.jsonl"
          done

  # The list and runtime.json without uploading anything: what a publish would write, as a workflow artifact.
  prepare:
    name: Prepare the list and runtime.json
    needs: [smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ocr-*
          path: dist-ocr
          merge-multiple: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: node scripts/publish-modules.ts dist-ocr
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runtime-json
          path: |
            dist-ocr/runtime.json
            dist-ocr/models.json
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Sign and publish to R2
    needs: [prepare]
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: downloads
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Signing key present
        env:
          THOTH_MODULES_SIGNING_KEY: ${{ secrets.THOTH_MODULES_SIGNING_KEY }}
        run: |
          if [ -z "$THOTH_MODULES_SIGNING_KEY" ]; then
            echo "::error::the THOTH_MODULES_SIGNING_KEY repository secret is missing: the model list would be unsigned"
            exit 1
          fi
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ocr-*
          path: dist-ocr
          merge-multiple: true
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      # Tauri's signer signs the list, as release-desktop.yml signs updates.
      - run: pnpm install --frozen-lockfile
      - name: Sign and upload
        env:
          THOTH_MODULES_SIGNING_KEY: ${{ secrets.THOTH_MODULES_SIGNING_KEY }}
          THOTH_MODULES_SIGNING_KEY_PASSWORD: ${{ secrets.THOTH_MODULES_SIGNING_KEY_PASSWORD }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: node scripts/publish-modules.ts dist-ocr --publish
