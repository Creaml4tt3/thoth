[package]
name = "thoth-mcp"
version = "0.1.3"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Thoth's MCP server for other apps (ADR-0021): MCP over stdio, each tool call relayed to the running Thoth app. Read only; opens no vault."

[[bin]]
name = "thoth-mcp"
path = "src/main.rs"

[dependencies]
serde_json.workspace = true

[target.'cfg(unix)'.dependencies]
rustix.workspace = true

[dev-dependencies]
tempfile.workspace = true
