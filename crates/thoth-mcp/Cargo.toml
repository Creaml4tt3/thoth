[package]
name = "thoth-mcp"
version = "0.1.3"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Thoth's MCP server for other apps (ADR-0021): MCP over stdio, each tool call relayed to the running Thoth app; with Thoth closed, the memory tools the user allows (ADR-0052 rule 9)."

[[bin]]
name = "thoth-mcp"
path = "src/main.rs"

[dependencies]
serde_json.workspace = true
# The memory folder while Thoth is closed (ADR-0052 rule 9): the app's own settings, history and file layer; on
# Windows also the pipe to the app (`thoth_host::mcp::pipe`).
thoth-host.workspace = true

[target.'cfg(unix)'.dependencies]
rustix.workspace = true

[dev-dependencies]
tempfile.workspace = true
